            font-family: Arial, sans-serif;

            background-color: white; /* Изменили цвет фона на белый */
        }

        .tg-icon {
            font-size: 36px;
            color: #0074b9;
            margin-bottom: 20px;

            margin-top: 0;

            display: flex;

        }

            margin-bottom: 10px;
